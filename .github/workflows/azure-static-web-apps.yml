name: Azure Static Web Apps Deploy (manual fallback)

# CircleCI is now the pipeline of record for deployment (see
# docs/architecture-decision-records/0002-circleci-alongside-github-actions.md and
# .circleci/config.yml) — it deploys automatically on every push to main. This workflow
# no longer runs automatically; it exists as a manual fallback if CircleCI is ever
# unavailable, triggered by hand from the Actions tab ("Run workflow").
#
# ci.yml still runs automatically on every push/PR as a GitHub-native quality-gate
# status check, independent of this workflow and of CircleCI.
#
# Setup required in your Azure/GitHub account before this will run:
#   1. Create an Azure Static Web App (Static HTML / "Other" build preset).
#   2. Copy its deployment token: Azure Portal → your SWA → "Manage deployment token".
#   3. Add it as a GitHub Actions secret named AZURE_STATIC_WEB_APPS_API_TOKEN
#      (Repo Settings → Secrets and variables → Actions → New repository secret).
# No other secrets or credentials are required — this app has no backend API.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy to Azure Static Web Apps
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/'
          output_location: 'dist'
          skip_app_build: true
          app_build_command: ''
