name: Azure Static Web Apps CI/CD (lemon-rock, legacy manual fallback)

# CircleCI is the pipeline of record for deployment (see .circleci/config.yml and
# docs/architecture-decision-records/0002-circleci-alongside-github-actions.md), and
# azure-static-web-apps.yml is the documented manual fallback. This workflow was
# auto-generated by the Azure Portal when the Static Web App resource was created and is
# redundant with those two. It's kept only as a secondary manual fallback tied to its own
# portal-issued deployment token; trigger it by hand from the Actions tab if needed.
#
# Its quality-gate/build/deploy shape mirrors azure-static-web-apps.yml exactly, so a manual
# trigger here can't ship code that skipped lint/typecheck/test/audit, and the artifact Azure
# receives is the same `npm run build` output CI already validated (not a separate Oryx build).
# No PR-preview environment is configured for this project, so the Azure-Portal-generated
# close_pull_request_job and its automatic PR trigger were removed — see CHANGELOG.md.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-lemon-rock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  build_and_deploy_job:
    name: Build and Deploy Job
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_ROCK_042DA4500 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/'
          output_location: 'dist'
          skip_app_build: true
          app_build_command: ''
